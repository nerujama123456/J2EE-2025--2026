<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm sản phẩm</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">

            <h3 class="text-primary mb-4">➕ Thêm sản phẩm</h3>

            <form th:action="@{/products/save}"
                  th:object="${product}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Tên sản phẩm</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Giá</label>
                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Số lượng</label>
                    <input type="number"
                           th:field="*{quantity}"
                           class="form-control"
                           required>
                </div>

                <button type="submit" class="btn btn-success">
                    Lưu
                </button>

                <a th:href="@{/products}"
                   class="btn btn-secondary">
                    Quay lại
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
